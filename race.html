<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>レースゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
  }
  #gameCanvas {
    border: 3px solid #333;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(255,200,0,0.15);
    display: block;
  }
  #info {
    color: #aaa;
    font-size: 13px;
    margin-top: 10px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="info">↑ 加速 &nbsp;|&nbsp; ← → 移動 &nbsp;|&nbsp; R リスタート</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 420;
canvas.height = 640;

// ===== ゲーム状態 =====
let state = 'playing'; // 'playing' | 'gameover'
let score = 0;
let frame = 0;
let roadOffset = 0;
let baseScrollSpeed = 3;
let scrollSpeed = baseScrollSpeed;

// ===== パワーアップ =====
const POWERUP = { NONE: 0, BIG_TIRES: 1, WINGS: 2, SPEED: 3 };
let activePowerup = POWERUP.NONE;
let powerupTimer = 0;
const POWERUP_DURATION = 360; // 6秒@60fps

// ===== プレイヤー =====
const CAR_W = 44;
const CAR_H = 76;
const player = {
  x: canvas.width / 2 - CAR_W / 2,
  y: canvas.height - CAR_H - 30,
  w: CAR_W,
  h: CAR_H,
  vx: 0,
  moveSpeed: 5,
};

// ===== オブジェクト =====
let objects = [];

// ===== メッセージ =====
let flashMsg = '';
let flashTimer = 0;
let flashAlpha = 1;

// ===== キー入力 =====
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR' && state === 'gameover') restartGame();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ===== ロード描画用データ =====
const ROAD_LEFT = 30;
const ROAD_RIGHT = canvas.width - 30;
const ROAD_W = ROAD_RIGHT - ROAD_LEFT;
const LANE_DASH_H = 48;
const LANE_DASH_GAP = 36;
const LANE_CYCLE = LANE_DASH_H + LANE_DASH_GAP;

// ===== ユーティリティ =====
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

function showMsg(msg) {
  flashMsg = msg;
  flashTimer = 150;
}

function spawnObject() {
  const isQuestion = Math.random() < 0.45;
  const margin = 60;
  const x = rand(ROAD_LEFT + margin, ROAD_RIGHT - margin - 44);
  objects.push({
    type: isQuestion ? 'question' : 'obstacle',
    x, y: -50,
    w: 44, h: 44,
    angle: 0,
  });
}

function applyPowerup() {
  const roll = randInt(1, 3);
  activePowerup = roll;
  powerupTimer = POWERUP_DURATION;
  if (roll === POWERUP.BIG_TIRES) showMsg('🛞 タイヤが大きくなった！');
  else if (roll === POWERUP.WINGS)  showMsg('🪽 羽が生えた！');
  else                               showMsg('⚡ スピードアップ！');
}

function resetPowerup() {
  activePowerup = POWERUP.NONE;
  powerupTimer = 0;
}

function collides(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ===== 描画: 道路 =====
function drawRoad() {
  // アスファルト
  ctx.fillStyle = '#2c2c2c';
  ctx.fillRect(ROAD_LEFT, 0, ROAD_W, canvas.height);

  // 路肩のグリーン
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, 0, ROAD_LEFT, canvas.height);
  ctx.fillRect(ROAD_RIGHT, 0, canvas.width - ROAD_RIGHT, canvas.height);

  // 縁石 (赤白交互)
  const CURB_W = 10;
  const CURB_SEG = 30;
  for (let y = -CURB_SEG; y < canvas.height + CURB_SEG; y += CURB_SEG) {
    const oy = (y + roadOffset) % (CURB_SEG * 2);
    const even = Math.floor((y + roadOffset) / CURB_SEG) % 2 === 0;
    ctx.fillStyle = even ? '#c0392b' : '#ecf0f1';
    ctx.fillRect(ROAD_LEFT, oy - CURB_SEG, CURB_W, CURB_SEG + 1);
    ctx.fillStyle = even ? '#ecf0f1' : '#c0392b';
    ctx.fillRect(ROAD_RIGHT - CURB_W, oy - CURB_SEG, CURB_W, CURB_SEG + 1);
  }

  // センターライン (破線)
  const cx = canvas.width / 2;
  ctx.fillStyle = '#f1c40f';
  for (let y = -LANE_CYCLE; y < canvas.height + LANE_CYCLE; y += LANE_CYCLE) {
    const ty = (y + roadOffset % LANE_CYCLE);
    ctx.fillRect(cx - 3, ty, 6, LANE_DASH_H);
  }

  // レーンライン (白破線 x2)
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  const lanePositions = [ROAD_LEFT + ROAD_W * 0.33, ROAD_LEFT + ROAD_W * 0.67];
  lanePositions.forEach(lx => {
    for (let y = -LANE_CYCLE; y < canvas.height + LANE_CYCLE; y += LANE_CYCLE) {
      const ty = (y + roadOffset % LANE_CYCLE);
      ctx.fillRect(lx - 2, ty, 4, LANE_DASH_H * 0.7);
    }
  });
}

// ===== 描画: 車 =====
function drawCar() {
  const { x, y, w, h } = player;
  const hasBigTires = activePowerup === POWERUP.BIG_TIRES;
  const hasWings    = activePowerup === POWERUP.WINGS;
  const hasSpeed    = activePowerup === POWERUP.SPEED;
  const tireR = hasBigTires ? 13 : 8;

  ctx.save();

  // --- スピード炎エフェクト ---
  if (hasSpeed) {
    const gradient = ctx.createLinearGradient(x + w/2, y + h, x + w/2, y + h + 55);
    gradient.addColorStop(0, 'rgba(255,80,0,0.95)');
    gradient.addColorStop(0.4, 'rgba(255,180,0,0.7)');
    gradient.addColorStop(1, 'rgba(255,255,0,0)');
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = gradient;
      ctx.beginPath();
      const fx = x + 8 + i * (w - 16) / 2;
      ctx.moveTo(fx, y + h);
      ctx.lineTo(fx - 7 + i * 3, y + h + 30 + i * 10);
      ctx.lineTo(fx + 7 - i * 3, y + h + 30 + i * 10);
      ctx.closePath();
      ctx.fill();
    }
  }

  // --- 羽 ---
  if (hasWings) {
    // 左翼
    ctx.fillStyle = '#e67e22';
    ctx.beginPath();
    ctx.moveTo(x - 2, y + h * 0.3);
    ctx.lineTo(x - 38, y + h * 0.1);
    ctx.lineTo(x - 28, y + h * 0.5);
    ctx.lineTo(x - 2, y + h * 0.55);
    ctx.closePath();
    ctx.fill();
    // 翼の縁
    ctx.strokeStyle = '#f39c12';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 右翼
    ctx.fillStyle = '#e67e22';
    ctx.beginPath();
    ctx.moveTo(x + w + 2, y + h * 0.3);
    ctx.lineTo(x + w + 38, y + h * 0.1);
    ctx.lineTo(x + w + 28, y + h * 0.5);
    ctx.lineTo(x + w + 2, y + h * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#f39c12';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // --- 車体メイン ---
  const bodyColor = hasSpeed ? '#ff4500' : hasWings ? '#8e44ad' : hasBigTires ? '#27ae60' : '#e74c3c';
  const shadowColor = hasSpeed ? '#8b0000' : hasWings ? '#4a1060' : hasBigTires ? '#145a32' : '#7b241c';

  // 車体シャドウ
  ctx.fillStyle = shadowColor;
  ctx.beginPath();
  roundRect(ctx, x + 3, y + 4, w - 6, h - 4, 10);
  ctx.fill();

  // 車体
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  roundRect(ctx, x, y, w, h - 4, 10);
  ctx.fill();

  // ボンネット (前)
  ctx.fillStyle = shadeColor(bodyColor, -15);
  ctx.beginPath();
  roundRect(ctx, x + 3, y, w - 6, 20, 10);
  ctx.fill();

  // トランク (後)
  ctx.fillStyle = shadeColor(bodyColor, -10);
  ctx.beginPath();
  roundRect(ctx, x + 4, y + h - 22, w - 8, 18, 6);
  ctx.fill();

  // フロントガラス
  ctx.fillStyle = 'rgba(100,200,255,0.7)';
  ctx.beginPath();
  roundRect(ctx, x + 7, y + 20, w - 14, 20, 4);
  ctx.fill();
  ctx.strokeStyle = 'rgba(200,240,255,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // リアガラス
  ctx.fillStyle = 'rgba(100,200,255,0.5)';
  ctx.beginPath();
  roundRect(ctx, x + 8, y + h - 20, w - 16, 12, 3);
  ctx.fill();

  // ヘッドライト
  ctx.fillStyle = '#ffffaa';
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.ellipse(x + 9, y + 7, 6, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + w - 9, y + 7, 6, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // テールライト
  ctx.fillStyle = hasSpeed ? '#ff8800' : '#cc0000';
  ctx.beginPath();
  ctx.ellipse(x + 9, y + h - 6, 6, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + w - 9, y + h - 6, 6, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // --- タイヤ ---
  const tireColor = '#111';
  const rimColor = hasBigTires ? '#f1c40f' : '#888';
  const tirePositions = [
    { tx: x,     ty: y + 14 },
    { tx: x + w, ty: y + 14 },
    { tx: x,     ty: y + h - 18 },
    { tx: x + w, ty: y + h - 18 },
  ];
  tirePositions.forEach(({ tx, ty }) => {
    ctx.fillStyle = tireColor;
    ctx.beginPath();
    ctx.arc(tx, ty, tireR, 0, Math.PI * 2);
    ctx.fill();
    // リム
    ctx.fillStyle = rimColor;
    ctx.beginPath();
    ctx.arc(tx, ty, tireR * 0.55, 0, Math.PI * 2);
    ctx.fill();
    // ハブ
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(tx, ty, tireR * 0.18, 0, Math.PI * 2);
    ctx.fill();
  });

  // スピードアップ時のグロー
  if (hasSpeed) {
    ctx.strokeStyle = 'rgba(255,100,0,0.6)';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#ff4400';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    roundRect(ctx, x - 2, y - 2, w + 4, h, 12);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// ===== 描画: ？ブロック =====
function drawQuestionBlock(obj) {
  const { x, y, w, h } = obj;
  obj.angle = (obj.angle || 0) + 0.03;
  ctx.save();
  ctx.translate(x + w/2, y + h/2);
  ctx.rotate(Math.sin(obj.angle) * 0.08);

  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(-w/2 + 3, -h/2 + 4, w, h);

  // 本体グラデ
  const grd = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
  grd.addColorStop(0, '#ffe066');
  grd.addColorStop(0.5, '#f1c40f');
  grd.addColorStop(1, '#d4a017');
  ctx.fillStyle = grd;
  ctx.beginPath();
  roundRect(ctx, -w/2, -h/2, w, h, 8);
  ctx.fill();

  // 縁
  ctx.strokeStyle = '#b7950b';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // ハイライト
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  roundRect(ctx, -w/2 + 3, -h/2 + 3, w/2, h/3, 5);
  ctx.fill();

  // ？文字
  ctx.fillStyle = '#5d3d00';
  ctx.font = `bold ${h * 0.58}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(255,255,255,0.5)';
  ctx.shadowBlur = 4;
  ctx.fillText('?', 0, 2);
  ctx.shadowBlur = 0;

  ctx.restore();
}

// ===== 描画: 障害物 =====
function drawObstacle(obj) {
  const { x, y, w, h } = obj;
  ctx.save();

  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(x + w/2 + 4, y + h + 4, w/2, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // 岩本体
  ctx.fillStyle = '#5d4037';
  ctx.beginPath();
  ctx.moveTo(x + 10, y);
  ctx.lineTo(x + w - 8, y + 4);
  ctx.lineTo(x + w, y + 14);
  ctx.lineTo(x + w - 2, y + h - 10);
  ctx.lineTo(x + w - 12, y + h);
  ctx.lineTo(x + 6, y + h - 4);
  ctx.lineTo(x, y + h - 16);
  ctx.lineTo(x + 2, y + 10);
  ctx.closePath();
  ctx.fill();

  // 岩のハイライト
  ctx.fillStyle = '#8d6e63';
  ctx.beginPath();
  ctx.moveTo(x + 10, y + 2);
  ctx.lineTo(x + w - 12, y + 6);
  ctx.lineTo(x + w - 6, y + 18);
  ctx.lineTo(x + 14, y + 22);
  ctx.lineTo(x + 6, y + 14);
  ctx.closePath();
  ctx.fill();

  // 亀裂
  ctx.strokeStyle = '#3e2723';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 18, y + 6);
  ctx.lineTo(x + 22, y + 20);
  ctx.lineTo(x + 16, y + 30);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 28, y + 10);
  ctx.lineTo(x + 24, y + 26);
  ctx.stroke();

  ctx.restore();
}

// ===== 描画: HUD =====
function drawHUD() {
  // 上部バー
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, canvas.width, 52);

  // スコア
  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('SCORE', 14, 8);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.fillText(Math.floor(score).toString().padStart(6, '0'), 14, 24);

  // スピード
  const kmh = Math.floor(scrollSpeed * 22);
  ctx.fillStyle = '#aef';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('SPEED', canvas.width - 14, 8);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.fillText(kmh + ' km/h', canvas.width - 14, 24);

  // パワーアップバー
  if (activePowerup !== POWERUP.NONE) {
    const ratio = powerupTimer / POWERUP_DURATION;
    const barW = 160;
    const barX = canvas.width / 2 - barW / 2;

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, barX - 2, 8, barW + 4, 18, 5);
    ctx.fill();

    const color = activePowerup === POWERUP.SPEED ? '#ff8c00'
                : activePowerup === POWERUP.WINGS  ? '#a855f7'
                : '#22c55e';
    ctx.fillStyle = color;
    ctx.beginPath();
    roundRect(ctx, barX, 10, barW * ratio, 14, 4);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const label = activePowerup === POWERUP.BIG_TIRES ? 'BIG TIRES'
                : activePowerup === POWERUP.WINGS      ? 'WINGS'
                : 'SPEED UP';
    ctx.fillText(label, canvas.width / 2, 17);
  }
}

// ===== 描画: フラッシュメッセージ =====
function drawFlashMsg() {
  if (flashTimer <= 0) return;
  flashTimer--;
  const alpha = Math.min(flashTimer / 40, 1);
  const scale = flashTimer > POWERUP_DURATION * 0.8 ? 1 + (1 - flashTimer / POWERUP_DURATION) * 0.5 : 1;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(canvas.width / 2, canvas.height / 2 - 60);
  ctx.scale(scale, scale);
  ctx.font = 'bold 26px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // アウトライン
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 5;
  ctx.strokeText(flashMsg, 0, 0);
  ctx.fillStyle = '#ffe066';
  ctx.fillText(flashMsg, 0, 0);

  ctx.restore();
}

// ===== 描画: ゲームオーバー =====
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 52px Arial';
  ctx.strokeStyle = '#c0392b';
  ctx.lineWidth = 6;
  ctx.strokeText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Arial';
  ctx.fillText('スコア: ' + Math.floor(score).toString().padStart(6, '0'), canvas.width / 2, canvas.height / 2);

  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 18px Arial';
  const pulse = 0.7 + 0.3 * Math.sin(frame * 0.08);
  ctx.globalAlpha = pulse;
  ctx.fillText('R キーでリスタート', canvas.width / 2, canvas.height / 2 + 50);
  ctx.globalAlpha = 1;
}

// ===== ゲームリセット =====
function restartGame() {
  state = 'playing';
  score = 0;
  frame = 0;
  scrollSpeed = baseScrollSpeed;
  player.x = canvas.width / 2 - CAR_W / 2;
  player.vx = 0;
  objects = [];
  activePowerup = POWERUP.NONE;
  powerupTimer = 0;
  flashMsg = '';
  flashTimer = 0;
  roadOffset = 0;
}

// ===== ヘルパー: 角丸矩形 =====
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function shadeColor(hex, pct) {
  hex = hex.replace('#', '');
  const num = parseInt(hex, 16);
  let r = Math.max(0, Math.min(255, (num >> 16) + pct));
  let g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + pct));
  let b = Math.max(0, Math.min(255, (num & 0xff) + pct));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

// ===== メインループ =====
function gameLoop() {
  frame++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (state === 'gameover') {
    drawRoad();
    objects.forEach(o => o.type === 'question' ? drawQuestionBlock(o) : drawObstacle(o));
    drawCar();
    drawHUD();
    drawGameOver();
    requestAnimationFrame(gameLoop);
    return;
  }

  // --- スクロール速度更新 ---
  const maxSpeed = activePowerup === POWERUP.SPEED ? 12 : 7;
  if (keys['ArrowUp']) {
    scrollSpeed = Math.min(maxSpeed, scrollSpeed + 0.08);
  } else {
    scrollSpeed = Math.max(baseScrollSpeed, scrollSpeed - 0.04);
  }

  // --- 難易度上昇 ---
  baseScrollSpeed = 3 + Math.floor(score / 800) * 0.4;

  // --- 道路スクロール ---
  roadOffset = (roadOffset + scrollSpeed) % (LANE_CYCLE * 10);

  // --- プレイヤー移動 ---
  const lateralSpeed = player.moveSpeed + (activePowerup === POWERUP.WINGS ? 2 : 0);
  if (keys['ArrowLeft'])  player.x = Math.max(ROAD_LEFT + 10, player.x - lateralSpeed);
  if (keys['ArrowRight']) player.x = Math.min(ROAD_RIGHT - player.w - 10, player.x + lateralSpeed);

  // --- オブジェクト生成 ---
  const spawnInterval = Math.max(45, 90 - Math.floor(score / 400) * 5);
  if (frame % spawnInterval === 0) spawnObject();

  // --- オブジェクト更新 ---
  objects.forEach(o => { o.y += scrollSpeed; });
  objects = objects.filter(o => o.y < canvas.height + 60);

  // --- 衝突判定 ---
  const pBox = { x: player.x + 5, y: player.y + 4, w: player.w - 10, h: player.h - 8 };
  for (let i = objects.length - 1; i >= 0; i--) {
    const o = objects[i];
    const oBox = { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 8 };
    if (collides(pBox, oBox)) {
      if (o.type === 'question') {
        applyPowerup();
      } else {
        state = 'gameover';
      }
      objects.splice(i, 1);
    }
  }

  // --- パワーアップタイマー ---
  if (activePowerup !== POWERUP.NONE) {
    powerupTimer--;
    if (powerupTimer <= 0) resetPowerup();
  }

  // --- スコア更新 ---
  score += scrollSpeed * 0.15;

  // --- 描画 ---
  drawRoad();
  objects.forEach(o => o.type === 'question' ? drawQuestionBlock(o) : drawObstacle(o));
  drawCar();
  drawHUD();
  drawFlashMsg();

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
